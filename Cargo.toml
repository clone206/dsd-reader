[package]
name = "dsd-reader"
version = "0.3.1"
authors = ["clone206"]
edition = "2024"
license = "MIT/Apache-2.0"
description = "A Rust library for reading DSD (Direct Stream Digital) audio data from DSF, DFF, or raw sources."
readme = "README.md"
repository = "https://github.com/clone206/dsd-reader"
keywords = ["audio", "dsd", "dsf", "dff", "decoder"]
categories = ["multimedia", "parsing"]

[dependencies]
dsf-meta = "0.2.6"
dff-meta = { path = "../dff" }
# NOTE: points at the same physical checkout dff-meta uses (../dsd-source),
# not the vendor/dsd-source submodule, so both crates resolve to one
# `dsd-source` crate instance. Revert to `vendor/dsd-source` once dsd-source
# is published and both dependents pin a released version instead.
dsd-source = { path = "../dsd-source" }
log = { version = "0.4.28", features = ["std"] }
id3 = "1.16.3"
